if $programname == 'ai095' and $syslogseverity <= '5' then {
    action(type="omfile"
           file="/var/log/ai095.log"
           template="AITEMPLATENEW"  # Use the defined template for formatting
           fileCreateMode="0640")
    & stop
}

if $programname == 'snmptrapHandler' and $syslogseverity <= '5' then {
    action(type="omfile"
           file="/var/log/snmptrapHandler.log"
           template="AITEMPLATENEW"  # Use the defined template for formatting
           fileCreateMode="0640")
    & stop
}

if $programname == 'rsuScalar' and $syslogseverity <= '5' then {
    action(type="omfile"
           file="/var/log/rsuScalar.log"
           template="AITEMPLATENEW"  # Use the defined template for formatting
           fileCreateMode="0640")
    & stop
}

