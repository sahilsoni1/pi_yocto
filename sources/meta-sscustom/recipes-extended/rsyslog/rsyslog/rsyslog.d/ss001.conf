# AI template for rsuScalar process.
# Define the template for logging
#$template AITEMPLATE, "[LEVEL:%syslogpriority%] %TIMESTAMP% %HOSTNAME% %APP-NAME% %msg%\n"
$template AITEMPLATENEW, "[LEVEL:%syslogpriority%] %timegenerated:::date-rfc3339% %APP-NAME%[%PROCID%] %msg%"
$template AIFRONTTEMPLATE,"%timegenerated:::date-rfc3339% %APP-NAME%[%PROCID%] %msg%\n"

